name: Update developer command center
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    paths:
      - 'scripts/build_dashboard.py'
      - '.github/workflows/command-center.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dashboard using GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PROFILE_USER: Hosnaa-gh
        run: python scripts/build_dashboard.py
      - name: Commit refreshed SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/command-center.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh developer dashboard'
            git push
          fi
